server:
  port: 8800
  tomcat:
    max-swallow-size: 3MB

spring:
  application:
    name: web-bff
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:ticketredis}
      database: 0

dubbo:
  application:
    name: web-bff
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
  consumer:
    check: false
    timeout: 3000
