server:
  port: 8800
  tomcat:
    max-swallow-size: 3MB

spring:
  application:
    name: web-bff
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:ticket_box}
    username: root
    password: ${MYSQL_ROOT_PASSWORD:ticketmysql}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:ticketredis}
      database: 0

app:
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:0}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:ticketminio}
    secret-key: ${MINIO_ROOT_PASSWORD:ticketminio}
    bucket: ${MINIO_BUCKET:ticket-box}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000}

dubbo:
  application:
    name: web-bff
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
  consumer:
    check: false
    timeout: 3000