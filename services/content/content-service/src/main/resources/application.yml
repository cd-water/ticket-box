server:
  port: 8802

spring:
  application:
    name: content
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE_CONTENT:ticket_box_content}
    username: root
    password: ${MYSQL_ROOT_PASSWORD:ticketmysql}
  flyway:
    enabled: true

dubbo:
  application:
    name: content
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
  protocol:
    name: dubbo
    port: 20881
  consumer:
    check: false
    timeout: 3000
