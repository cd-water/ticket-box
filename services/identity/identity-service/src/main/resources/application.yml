server:
  port: 8801

spring:
  application:
    name: identity
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE_IDENTITY:ticket_box_identity}
    username: root
    password: ${MYSQL_ROOT_PASSWORD:ticketmysql}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:ticketredis}
      database: 0
  flyway:
    enabled: true

app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:ticketminio}
    secret-key: ${MINIO_ROOT_PASSWORD:ticketminio}
    bucket: ${MINIO_BUCKET:ticket-box}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000}

dubbo:
  application:
    name: identity
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
  protocol:
    name: dubbo
    port: 20880
