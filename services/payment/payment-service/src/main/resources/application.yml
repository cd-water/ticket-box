server:
  port: 8805

spring:
  application:
    name: payment
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE_PAYMENT:ticket_box_payment}
    username: root
    password: ${MYSQL_ROOT_PASSWORD:ticketmysql}
  flyway:
    enabled: false

dubbo:
  application:
    name: payment
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
  protocol:
    name: dubbo
    port: 20884
  consumer:
    check: false
    timeout: 3000
