server:
  port: 8803

spring:
  application:
    name: inventory
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE_INVENTORY:ticket_box_inventory}
    username: root
    password: ${MYSQL_ROOT_PASSWORD:ticketmysql}
  flyway:
    enabled: true

dubbo:
  application:
    name: inventory
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
  protocol:
    name: dubbo
    port: 20882
  consumer:
    check: false
    timeout: 3000
