name: ticket-box

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.46
    container_name: ticket-box-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ticket-box-network
    restart: unless-stopped
  # Redis 缓存
  redis:
    image: redis:7.4.11
    container_name: ticket-box-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ticket-box-network
    restart: unless-stopped
  # MinIO 对象存储
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ticket-box-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - ticket-box-network
    restart: unless-stopped

networks:
  ticket-box-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data: